name = "github-repo-watcher"
main = "src/index.js"
compatibility_date = "2024-01-01"

# ── KV Namespace for storing state ──
# Run `wrangler kv:namespace create WATCHER_STATE` to get the id
[[kv_namespaces]]
binding = "WATCHER_STATE"
id = "c166e000694c4838a79b07fca53d61e2"

# ── Cron Triggers ──
# 定时检查由 GitHub Actions 驱动（.github/workflows/check.yml）
# 通过 /api/cron/trigger 端点触发，不在 Cloudflare 侧注册 cron

# Note: All sensitive config (tokens, chat ID, repo list) is now stored in KV
# via the web dashboard. No need for wrangler secrets for runtime config.

# ── Variables ──
[vars]
CRON_SCHEDULE = "*/30 * * * *"
UPDATE_HUB_URL = "https://update-hub.xinming.dpdns.org"
# UPDATE_HUB_TOKEN 通过 `wrangler secret put UPDATE_HUB_TOKEN` 设置
