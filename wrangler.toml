name = "github-repo-watcher"
main = "src/index.js"
compatibility_date = "2024-01-01"

# ── KV Namespace for storing state ──
# Run `wrangler kv:namespace create WATCHER_STATE` to get the id
# 实际 ID 通过 `wrangler kv:namespace create WATCHER_STATE` 生成，每个 Cloudflare 账户不同
[[kv_namespaces]]
binding = "WATCHER_STATE"
# 真实 namespace id 请放本地 / 私有部署配置，公开仓库用占位符
# 生成：wrangler kv:namespace create WATCHER_STATE
id = "c166e000694c4838a79b07fca53d61e2"

# ── Cron Triggers ──
# 定时检查由 GitHub Actions 驱动（.github/workflows/check.yml）
# 通过 /api/cron/trigger 端点触发，不在 Cloudflare 侧注册 cron

# ── Variables ──
[vars]
CRON_SCHEDULE = "*/30 * * * *"

# ── Secrets（通过 wrangler secret put 设置，不出现在代码仓库中）──
# UPDATE_HUB_URL   — Update Hub 地址
# UPDATE_HUB_TOKEN — Update Hub 认证 Token
# CRON_SECRET      — GitHub Actions 调用 /api/cron/trigger 的鉴权 Token
# DASHBOARD_URL    — 周报通知中的回链地址（留空则 fallback 到 GitHub 仓库地址）
